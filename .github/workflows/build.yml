# 云编译 + 自动发 Release：Actions → Build & Release → Run workflow。
#
# 流程：读 mygo.json 的 version → 建 draft release（tag = v<version>，notes 取 CHANGELOG
#       里 "## <version>" 小节）→ 三平台编译并把安装包传进这个 draft → 全部成功后转正。
#
# fork 里没有 Apple Developer ID 证书和更新私钥，所以 macOS 走 ad-hoc 签名（-sign -）、
# 不公证（-skip-notarize），也不产 update-*.json；安装包能装，首次打开要右键 → 打开。
# 发新版本：改 mygo.json 的 version，在 CHANGELOG.md 加同名 "## x.y.z" 小节，再点 Run workflow。

name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: v
        run: |
          version=$(jq -r .version mygo.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Take the notes from the changelog
        run: |
          awk -v heading="## ${{ steps.v.outputs.version }}" '
            /^## / { inside = ($0 == heading); next }
            inside
          ' CHANGELOG.md | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.v.outputs.tag }}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --draft --target "$GITHUB_SHA" \
              --title "MyGo 云音乐 ${{ steps.v.outputs.version }}" \
              --notes-file "$RUNNER_TEMP/notes.md"

  build:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # <slug>-setup-<version>-<arch>.exe 由 NSIS 生成
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build
        run: >-
          go tool mygo build
          -platform "${{ matrix.platform }}"
          -o dist
          -sign -
          -skip-notarize

      - name: Upload the artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/
          if-no-files-found: error

      - name: Upload the installers to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*/*.dmg dist/*/*-setup-*.exe dist/*/*.tar.gz dist/*/*.deb)
          gh release upload "${{ needs.prepare.outputs.tag }}" "${files[@]}" --clobber \
            --repo "${{ github.repository }}"

  publish:
    name: Publish
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ needs.prepare.outputs.tag }}" --draft=false --repo "${{ github.repository }}"
